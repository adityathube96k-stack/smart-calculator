{% extends "base.html" %}
{% block title %}Discount Calculator — Smart Calculator{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">{% endblock %}

{% block content %}
<h1>Discount Calculator</h1>
<p>Find the final price after a percentage discount.</p>

<div class="card" style="max-width: 480px;">
    <div class="field">
        <label for="discountPriceInput">Original price</label>
        <input type="number" step="any" id="discountPriceInput" placeholder="e.g. 2500">
    </div>
    <div class="field">
        <label for="discountPercentInput">Discount (%)</label>
        <input type="number" step="any" id="discountPercentInput" placeholder="e.g. 20">
    </div>
    <button class="btn btn--primary btn--block" id="calcDiscountBtn">Calculate</button>
    <div class="error-text" id="discountError"></div>

    <div class="finance-results" id="discountResults" style="display:none;">
        <div class="finance-result-item"><label>You Save</label><span id="discountAmount"></span></div>
        <div class="finance-result-item"><label>Final Price</label><span id="discountFinal"></span></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/finance-misc.js') }}"></script>
{% endblock %}
