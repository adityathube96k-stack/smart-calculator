{% extends "base.html" %}
{% block title %}Login — Smart Calculator{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Welcome back</h1>
    <p>Log in to save your calculation history and favorites.</p>

    <form method="POST" action="{{ url_for('auth.login') }}" class="auth-form">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>
        <div class="field field--inline">
            <label><input type="checkbox" name="remember"> Remember me</label>
        </div>
        <button type="submit" class="btn btn--primary btn--block">Log In</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
</div>
{% endblock %}
