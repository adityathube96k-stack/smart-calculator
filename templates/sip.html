{% extends "base.html" %}
{% block title %}SIP Calculator — Smart Calculator{% endblock %}
{% block extra_css %}<link rel="stylesheet" href="{{ url_for('static', filename='css/finance.css') }}">{% endblock %}

{% block content %}
<h1>SIP Calculator</h1>
<p>Estimate the future value of a monthly Systematic Investment Plan.</p>

<div class="card" style="max-width: 480px;">
    <div class="field">
        <label for="sipMonthlyInput">Monthly investment</label>
        <input type="number" step="any" id="sipMonthlyInput" placeholder="e.g. 5000">
    </div>
    <div class="field-row">
        <div class="field">
            <label for="sipRateInput">Expected annual return (%)</label>
            <input type="number" step="any" id="sipRateInput" placeholder="e.g. 12">
        </div>
        <div class="field">
            <label for="sipTenureInput">Tenure (years)</label>
            <input type="number" step="any" id="sipTenureInput" placeholder="e.g. 10">
        </div>
    </div>
    <button class="btn btn--primary btn--block" id="calcSipBtn">Calculate</button>
    <div class="error-text" id="sipError"></div>

    <div class="finance-results" id="sipResults" style="display:none;">
        <div class="finance-result-item"><label>Invested</label><span id="sipInvested"></span></div>
        <div class="finance-result-item"><label>Est. Returns</label><span id="sipReturns"></span></div>
        <div class="finance-result-item"><label>Future Value</label><span id="sipFutureValue"></span></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/validation.js') }}"></script>
<script src="{{ url_for('static', filename='js/sip.js') }}"></script>
{% endblock %}
